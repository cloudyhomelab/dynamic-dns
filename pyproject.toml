[project]
name = "dynamic-dns"
version = "0.1.0"
description = "Sync DNS A and AAAA records for domains hosted with Porkbun"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
dynamic-dns = "dynamic_dns.main:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["CPY001"]

[tool.ruff.lint.flake8-copyright]
notice-rgx = "SPDX-License-Identifier: GPL-3.0-or-later"
