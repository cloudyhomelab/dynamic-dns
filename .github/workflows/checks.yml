name: checks

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # oldest supported (requires-python) and newest
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # --locked fails if uv.lock is out of date with pyproject.toml
      - run: uv sync --locked

      # same hooks as locally: ruff check, ruff format, mypy --strict, pytest
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  # the single required status check for PRs; add new jobs to `needs`
  all-checks-passed:
    name: all checks passed
    if: always()
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      # without if: always() a failed dependency skips this job, and GitHub treats skipped as passing
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
